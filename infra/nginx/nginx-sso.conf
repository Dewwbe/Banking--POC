# Reverse proxy variant for the SSO profile: the Strapi login page offers BOTH email/password and "Sign in with
# Microsoft". Port 8080 -> Next.js public site. Port 8081 -> Strapi (public API + admin).
#   - /admin and the password login stay reachable (IP allow-list + rate limit), so password sign-in still works.
#   - /sso/entra is gated by Entra ID (oauth2-proxy); on success Strapi opens an admin session for the matching user.
# Entra-ONLY variant (the whole /admin behind the gate, then Strapi's own form): nginx-sso-gate-only.conf.
# Don't run alongside `proxy` (nginx.conf) — same ports. See docs/08-sso-mfa-setup.md.

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 10m;                     # must match UPLOAD_MAX_FILE_SIZE_MB

  # Rate-limit zones
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
  limit_req_status 429;

  # Networks allowed to reach the admin panel. Adjust to the bank's VPN / office ranges.
  geo $admin_allowed {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;   # Docker networks — remove to simulate a disallowed network
    192.168.0.0/16 1;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ---------------- Public website ----------------
  server {
    listen 8080;
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/revalidate {
      if ($admin_allowed = 0) { return 403; }
      proxy_pass http://web:3000;
    }
  }

  # ---------------- Strapi ----------------
  server {
    listen 8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The Entra session cookie (id_token + access token) is split across several large cookies; the default
    # 4k/8k buffers make nginx answer 502 "upstream sent too big header" on /oauth2/callback.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    large_client_header_buffers 4 32k;

    # Never forward a client-supplied Entra identity to Strapi: only /sso/entra (below) sets it, from the verified session.
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-User "";

    # Internal auth-check — asks oauth2-proxy whether this request has a valid Entra session.
    location = /oauth2-auth {
      internal;
      proxy_pass http://oauth2-proxy:4180/oauth2/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
    }

    # oauth2-proxy's own endpoints: sign-in page, Entra callback, sign-out.
    location /oauth2/ {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public content API — rate limited, GET only from the internet. No Entra gate — this is the public API.
    location /api/ {
      limit_req zone=public_api burst=40 nodelay;
      limit_except GET HEAD OPTIONS { deny all; }
      proxy_pass http://cms:1337;
    }

    location /uploads/ {
      proxy_pass http://cms:1337;
    }

    # "Sign in with Microsoft": the browser only reaches Strapi once oauth2-proxy has a valid Entra session (Conditional
    # Access / MFA is enforced by Entra). Strapi then opens an admin session for the Strapi user with the same email.
    # If there is no session yet, start the Entra flow and come back here (rd) afterwards.
    location = /sso/entra {
      if ($admin_allowed = 0) { return 403; }
      limit_req zone=admin_login burst=3 nodelay;
      auth_request /oauth2-auth;
      error_page 401 = @entra_start;
      auth_request_set $auth_user $upstream_http_x_auth_request_user;
      auth_request_set $auth_email $upstream_http_x_auth_request_email;
      proxy_set_header X-Forwarded-User $auth_user;
      proxy_set_header X-Forwarded-Email $auth_email;
      proxy_pass http://cms:1337;
    }
    location @entra_start { return 302 /oauth2/start?rd=%2Fsso%2Fentra; }

    # Admin password login — IP allow-list + rate limit (no Entra gate: password sign-in stays available).
    location = /admin/login {
      if ($admin_allowed = 0) { return 403; }
      limit_req zone=admin_login burst=3 nodelay;
      proxy_pass http://cms:1337;
    }

    # Admin panel and admin API — IP allow-list. Strapi's own session/RBAC protects them.
    location ~ ^/(admin|content-manager|content-type-builder|upload|i18n|users-permissions|email|documentation|graphql) {
      if ($admin_allowed = 0) { return 403; }
      proxy_pass http://cms:1337;
    }

    # Fallback landing for oauth2-proxy (e.g. after a plain /oauth2/sign_in): send the browser to the admin panel.
    location = / { return 302 /admin; }

    location / { return 404; }
  }
}