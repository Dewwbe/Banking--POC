# Reverse proxy variant for the SSO profile: /admin is gated by Entra ID (oauth2-proxy) in addition
# to the existing IP allow-list. Port 8080 -> Next.js public site. Port 8081 -> Strapi (public API + gated /admin).
# Don't run alongside `proxy` (nginx.conf) — same ports. See docs/08-sso-mfa-setup.md.

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 10m;                     # must match UPLOAD_MAX_FILE_SIZE_MB

  # Rate-limit zones
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
  limit_req_status 429;

  # Networks allowed to reach the admin panel. Adjust to the bank's VPN / office ranges.
  geo $admin_allowed {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;   # Docker networks — remove to simulate a disallowed network
    192.168.0.0/16 1;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ---------------- Public website ----------------
  server {
    listen 8080;
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/revalidate {
      if ($admin_allowed = 0) { return 403; }
      proxy_pass http://web:3000;
    }
  }

  # ---------------- Strapi ----------------
  server {
    listen 8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Internal auth-check — asks oauth2-proxy whether this request has a valid Entra session.
    location = /oauth2-auth {
      internal;
      proxy_pass http://oauth2-proxy:4180/oauth2/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
    }

    # oauth2-proxy's own endpoints: sign-in page, Entra callback, sign-out.
    location /oauth2/ {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public content API — rate limited, GET only from the internet. No Entra gate — this is the public API.
    location /api/ {
      limit_req zone=public_api burst=40 nodelay;
      limit_except GET HEAD OPTIONS { deny all; }
      proxy_pass http://cms:1337;
    }

    location /uploads/ {
      proxy_pass http://cms:1337;
    }

    # Admin login — IP allow-list + rate limit + Entra gate before Strapi's own login form is reached.
    location = /admin/login {
      if ($admin_allowed = 0) { return 403; }
      limit_req zone=admin_login burst=3 nodelay;
      auth_request /oauth2-auth;
      error_page 401 = /oauth2/sign_in;
      auth_request_set $auth_user $upstream_http_x_auth_request_user;
      proxy_set_header X-Forwarded-User $auth_user;
      proxy_pass http://cms:1337;
    }

    # Admin panel and admin API — IP allow-list + Entra gate.
    location ~ ^/(admin|content-manager|content-type-builder|upload|i18n|users-permissions|email|documentation|graphql) {
      if ($admin_allowed = 0) { return 403; }
      auth_request /oauth2-auth;
      error_page 401 = /oauth2/sign_in;
      auth_request_set $auth_user $upstream_http_x_auth_request_user;
      proxy_set_header X-Forwarded-User $auth_user;
      proxy_pass http://cms:1337;
    }

    location / { return 404; }
  }
}