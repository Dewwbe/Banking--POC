# SSO/MFA variant of infra/nginx/nginx.conf — Workstream E (Entra ID SSO/MFA gate via oauth2-proxy),
# on top of the same /admin IP allow-list and rate limiting as the base config.
# Used ONLY by the `sso` compose profile (service `proxy-sso`), on the same ports (8080/8081) as the
# plain `proxy` profile — run one or the other, not both (`docker compose --profile sso up -d`).
# Setup walkthrough (Entra app registration, env vars, test steps): docs/08-sso-mfa-setup.md
#
# IMPORTANT finding for the PoC report: this gate sits IN FRONT OF Strapi's own login, it does not
# replace it. A user sees two prompts — Microsoft sign-in (+ MFA, enforced by an Entra Conditional
# Access policy) first, then Strapi's own admin email/password form second. That is expected: Strapi
# Community has no native SSO auto-provisioning of admin accounts (that single-login behaviour is the
# Enterprise SSO feature). This proxy keeps unauthenticated people off /admin entirely and gets MFA
# enforced before Strapi is ever reached, but it cannot collapse the two logins into one without
# Strapi Enterprise.

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 10m;                     # must match UPLOAD_MAX_FILE_SIZE_MB

  # Rate-limit zones
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
  limit_req_status 429;

  # Networks allowed to reach the admin panel. Adjust to the bank's VPN / office ranges.
  # Test: request /admin from an allowed and a disallowed address (docs/02-test-cases.md SEC-10/11).
  geo $admin_allowed {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;   # Docker networks — remove to simulate a disallowed network
    192.168.0.0/16 1;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ---------------- Public website ----------------
  server {
    listen 8080;
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The revalidation webhook must only be callable from the CMS network.
    location /api/revalidate {
      if ($admin_allowed = 0) { return 403; }
      proxy_pass http://web:3000;
    }
  }

  # ---------------- Strapi ----------------
  server {
    listen 8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Public content API — rate limited, GET only from the internet.
    location /api/ {
      limit_req zone=public_api burst=40 nodelay;
      limit_except GET HEAD OPTIONS { deny all; }   # writes via the content API blocked at the edge
      proxy_pass http://cms:1337;
    }

    location /uploads/ {
      proxy_pass http://cms:1337;
    }

    # ---- Entra ID SSO/MFA gate (oauth2-proxy, `sso` profile only) ----
    # Internal-only: nginx asks oauth2-proxy "is this request's cookie a valid, already-authenticated
    # session?" before forwarding anything to Strapi. Never reached directly by a browser.
    location = /oauth2/auth {
      internal;
      proxy_pass http://oauth2-proxy:4180/oauth2/auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
    }

    # Public-facing oauth2-proxy endpoints: /oauth2/sign_in, /oauth2/start, /oauth2/callback.
    location /oauth2/ {
      proxy_pass http://oauth2-proxy:4180;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin login — strict rate limit + network restriction + (if `sso` profile active) Entra ID gate.
    location = /admin/login {
      if ($admin_allowed = 0) { return 403; }
      limit_req zone=admin_login burst=3 nodelay;
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
      proxy_pass http://cms:1337;
    }

    # Admin panel and admin API (content-manager, upload, users-permissions admin routes, i18n admin routes).
    location ~ ^/(admin|content-manager|content-type-builder|upload|i18n|users-permissions|email|documentation|graphql) {
      if ($admin_allowed = 0) { return 403; }
      auth_request /oauth2/auth;
      error_page 401 = /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
      proxy_pass http://cms:1337;
    }

    # Everything else is denied by default.
    location / { return 404; }
  }
}